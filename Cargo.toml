[workspace]
members = ["crates/*"]
exclude = []
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/KleosHQ/data-pipeline"
publish = false

[package]
name = "data-pipeline"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
publish = false

[workspace.dependencies]
# Core Utilities
anyhow = "1.0.101"
backoff = { version = "0.4", features = ["futures", "tokio"] }
clap = { version = "4.5.57", features = ["derive", "cargo", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "2.0.18"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "time"] }
base64 = "0.22"
bytes = "1.11.1"
hex = "0.4.3"
bs58 = "0.5.1"
regex = "1.12.3"
socket2 = { version = "0.6.2", features = ["all"] }

# Proc Macro
proc-macro2 = "1.0"
quote = "1.0.44"
syn = { version = "2.0", features = ["full", "parsing"] }
codama-nodes = "0.7.2"
prettyplease = "0.2"

# Async
futures = "0.3"
futures-util = "0.3.31"
tokio = { version = "1.48.0", features = ["macros", "sync", "rt-multi-thread", "time", "net", "signal"] }
tokio-tungstenite = "0.28.0"

# Serialization / gRPC
borsh = "1.6.0"
prost = "0.14.3"
prost-build = "0.14.3"
prost-types = "0.14.3"
protobuf-src = "1.1"
tonic = "0.14.3"
tonic-build = "0.14.3"
tonic-reflection = "0.14.3"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Solana / Yellowstone
yellowstone-grpc-client = "11"
yellowstone-grpc-proto = "11"
solana-signature = "3.2.0"
solana-pubkey = "4.0.0"
solana-transaction-status = "3.1.8"
solana-address = "2.1.0"
solana-message = "3.1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Internal
yellowstone-vixen-core = { path = "crates/core", version = "0.1.0" }
yellowstone-vixen-proto = { path = "crates/proto", version = "0.1.0" }
yellowstone-vixen-proc-macro = { path = "crates/proc-macro", version = "0.1.0" }

# Metrics (ClickHouse only; API server is separate)
clickhouse = { version = "0.14", features = ["rustls-tls"] }

# Snapshot cache for WS connect (migrated / soon_migrating)
redis = { version = "1.0.3", features = ["tokio-comp", "connection-manager"] }

[dependencies]
# Core Utilities
anyhow.workspace = true
backoff.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
bytes.workspace = true
hex.workspace = true
bs58.workspace = true
regex.workspace = true
socket2.workspace = true

# Proc Macro
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
codama-nodes.workspace = true
prettyplease.workspace = true

# Async
futures.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

# Serialization / gRPC
borsh.workspace = true
prost.workspace = true
prost-build.workspace = true
prost-types.workspace = true
protobuf-src.workspace = true
tonic.workspace = true
tonic-build.workspace = true
tonic-reflection.workspace = true
rustls.workspace = true

# Solana / Yellowstone
yellowstone-grpc-client.workspace = true
yellowstone-grpc-proto.workspace = true
solana-signature.workspace = true
solana-pubkey.workspace = true
solana-transaction-status.workspace = true
solana-address.workspace = true
solana-message.workspace = true

# Logging
log.workspace = true
env_logger.workspace = true

# Internal
yellowstone-vixen-core.workspace = true
yellowstone-vixen-proto.workspace = true
yellowstone-vixen-proc-macro.workspace = true

# Metrics (ClickHouse)
clickhouse.workspace = true

# Redis (snapshot cache)
redis.workspace = true
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
strip = true
